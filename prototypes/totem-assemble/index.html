<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Totem Assemble — Virtue Glyph prototype</title>
    <style>
      :root {
        --bg: #1a2420;
        --panel: #24302a;
        --ink: #e8efe9;
        --muted: #9aafa3;
        --accent: #3d9b6e;
        --accent-dim: #2a6b4c;
        --ghost: rgba(232, 239, 233, 0.12);
        --socket: rgba(61, 155, 110, 0.22);
        --socket-hot: rgba(61, 155, 110, 0.45);
        --piece: #c5a15a;
        --danger: #c45c4a;
        --radius: 14px;
        --font: "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font);
        color: var(--ink);
        background:
          radial-gradient(ellipse at 20% 0%, #2a4036 0%, transparent 50%),
          radial-gradient(ellipse at 90% 100%, #1e3329 0%, transparent 45%),
          var(--bg);
      }

      .wrap {
        max-width: 440px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }

      header h1 {
        font-size: 1.15rem;
        font-weight: 650;
        margin: 0 0 4px;
        letter-spacing: 0.02em;
      }

      header p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.4;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      .pill {
        border: 1px solid #3a4f45;
        background: var(--panel);
        color: var(--ink);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .pill.active {
        border-color: var(--accent);
        background: var(--accent-dim);
      }

      .card {
        background: var(--panel);
        border: 1px solid #354840;
        border-radius: var(--radius);
        padding: 16px;
      }

      .card h2 {
        margin: 0 0 6px;
        font-size: 1.05rem;
      }

      .hint {
        color: var(--muted);
        font-size: 0.82rem;
        margin: 0 0 14px;
        line-height: 1.4;
      }

      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 12px;
        background: #18221e;
        border: 1px dashed #3d5348;
        overflow: hidden;
        touch-action: manipulation;
      }

      .stage svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .ghost {
        fill: var(--ghost);
        stroke: rgba(232, 239, 233, 0.2);
        stroke-width: 2;
      }

      .socket {
        fill: var(--socket);
        stroke: rgba(61, 155, 110, 0.55);
        stroke-width: 2;
        stroke-dasharray: 6 4;
        cursor: pointer;
        transition: fill 0.15s;
      }

      .socket.hot {
        fill: var(--socket-hot);
        stroke: var(--accent);
        stroke-dasharray: none;
      }

      .socket.filled {
        fill: transparent;
        stroke: transparent;
        pointer-events: none;
      }

      .placed {
        pointer-events: none;
      }

      .tray {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
        gap: 10px;
        margin-top: 14px;
        min-height: 96px;
      }

      .piece {
        appearance: none;
        border: 2px solid #4a6356;
        background: #1c2923;
        border-radius: 12px;
        padding: 8px 6px 10px;
        color: var(--ink);
        cursor: pointer;
        touch-action: manipulation;
      }

      .piece svg {
        width: 100%;
        height: 56px;
        display: block;
      }

      .piece span {
        display: block;
        margin-top: 6px;
        font-size: 0.75rem;
        color: var(--muted);
        text-align: center;
      }

      .piece.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(61, 155, 110, 0.35);
      }

      .piece.shake {
        animation: shake 0.35s ease;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }

      .btn {
        appearance: none;
        border: none;
        border-radius: 10px;
        padding: 11px 16px;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        background: #3a4f45;
        color: var(--ink);
      }

      .btn-primary {
        background: var(--accent);
        color: #04140c;
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .solved {
        margin-top: 14px;
        padding: 14px;
        border-radius: 12px;
        background: rgba(61, 155, 110, 0.12);
        border: 1px solid rgba(61, 155, 110, 0.35);
      }

      .solved h3 {
        margin: 0 0 6px;
        font-size: 1rem;
      }

      .solved p {
        margin: 0 0 8px;
        font-size: 0.88rem;
        line-height: 1.45;
        color: var(--ink);
      }

      .solved .muted {
        color: var(--muted);
        font-size: 0.8rem;
        margin: 0;
      }

      .status {
        margin-top: 10px;
        min-height: 1.2em;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .status.err {
        color: #e8a090;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Totem Assemble</h1>
        <p>
          One-off prototype for Advanced Virtue Glyphs: restore a picture/totem from named parts (not Chinese character tiles).
        </p>
      </header>

      <div class="pill-row" id="picker"></div>

      <div class="card">
        <h2 id="title"></h2>
        <p class="hint" id="hint"></p>
        <div class="stage" id="stage" aria-label="Totem board"></div>
        <div class="tray" id="tray" aria-label="Parts tray"></div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="startBtn">Start</button>
          <button type="button" class="btn" id="resetBtn" hidden>Shuffle</button>
        </div>
        <p class="status" id="status"></p>
        <div class="solved" id="solved" hidden></div>
      </div>
    </div>

    <script>
      /**
       * Each part is an SVG path (or group markup) drawn in a 200×200 viewBox.
       * Sockets are circular hit targets; placement snaps the part to socket.cx/cy.
       */
      const PUZZLES = [
        {
          id: 'harmony',
          title: 'Harmony totem',
          blurb: 'Shared life inside one circle — not a contest of worth.',
          teaching:
            'Harmony here is pictured as two figures sharing a bowl under a round “all-under-heaven” ring. The parts only lock when the circle holds the meal and the people together.',
          parts: [
            {
              id: 'ring',
              label: 'shared ring',
              socket: { cx: 100, cy: 100, r: 82, innerR: 52 },
              svg: `<circle cx="100" cy="100" r="72" fill="none" stroke="#c5a15a" stroke-width="10"/>
                    <circle cx="100" cy="100" r="58" fill="none" stroke="#c5a15a" stroke-width="3" opacity="0.5"/>`,
            },
            {
              id: 'bowl',
              label: 'shared bowl',
              socket: { cx: 100, cy: 128, r: 36 },
              svg: `<ellipse cx="100" cy="122" rx="34" ry="12" fill="#c5a15a"/>
                    <path d="M66 122 Q100 155 134 122" fill="none" stroke="#8a6a2e" stroke-width="4"/>
                    <ellipse cx="100" cy="118" rx="28" ry="8" fill="#e2c57a"/>`,
            },
            {
              id: 'figures',
              label: 'two figures',
              socket: { cx: 100, cy: 72, r: 40 },
              svg: `<circle cx="78" cy="58" r="10" fill="#c5a15a"/>
                    <path d="M78 68 v34 M66 78 h24 M68 102 l-8 18 M88 102 l8 18" stroke="#c5a15a" stroke-width="5" stroke-linecap="round" fill="none"/>
                    <circle cx="122" cy="58" r="10" fill="#c5a15a"/>
                    <path d="M122 68 v34 M110 78 h24 M112 102 l-8 18 M132 102 l8 18" stroke="#c5a15a" stroke-width="5" stroke-linecap="round" fill="none"/>`,
            },
          ],
          decoys: [
            {
              id: 'sword',
              label: 'lone blade',
              svg: `<path d="M100 40 L108 120 L100 160 L92 120 Z" fill="#c5a15a"/>
                    <rect x="88" y="158" width="24" height="10" rx="2" fill="#8a6a2e"/>`,
            },
          ],
        },
        {
          id: 'commons',
          title: 'Commons totem',
          blurb: 'An open court — what is held in common, not claimed alone.',
          teaching:
            'The open gate, the shared hearth, and the four paths only make a commons when they meet in the middle. A closed wall piece will not belong here.',
          parts: [
            {
              id: 'court',
              label: 'open court',
              socket: { cx: 100, cy: 108, r: 48 },
              svg: `<rect x="55" y="70" width="90" height="80" rx="6" fill="none" stroke="#c5a15a" stroke-width="6"/>
                    <rect x="78" y="118" width="44" height="32" fill="#1c2923" stroke="#c5a15a" stroke-width="4"/>`,
            },
            {
              id: 'hearth',
              label: 'shared hearth',
              socket: { cx: 100, cy: 100, r: 28 },
              svg: `<circle cx="100" cy="100" r="18" fill="#e07a45"/>
                    <path d="M100 78 Q110 95 100 112 Q90 95 100 78" fill="#f0b060"/>
                    <path d="M88 120 h24" stroke="#c5a15a" stroke-width="5" stroke-linecap="round"/>`,
            },
            {
              id: 'paths',
              label: 'four paths',
              socket: { cx: 100, cy: 100, r: 95, innerR: 55 },
              svg: `<path d="M100 20 V55 M100 145 V180 M20 100 H55 M145 100 H180" stroke="#c5a15a" stroke-width="8" stroke-linecap="round"/>
                    <circle cx="100" cy="100" r="8" fill="#c5a15a"/>`,
            },
          ],
          decoys: [
            {
              id: 'wall',
              label: 'closed wall',
              svg: `<rect x="40" y="70" width="120" height="60" fill="#c5a15a"/>
                    <rect x="55" y="82" width="18" height="18" fill="#1c2923"/>
                    <rect x="91" y="82" width="18" height="18" fill="#1c2923"/>
                    <rect x="127" y="82" width="18" height="18" fill="#1c2923"/>`,
            },
          ],
        },
        {
          id: 'mean',
          title: 'Centered mean',
          blurb: 'Balance on a still point — neither tip wins.',
          teaching:
            'The beam, the fulcrum, and the twin weights only rest when the center holds. A single heavy weight alone cannot complete the emblem.',
          parts: [
            {
              id: 'beam',
              label: 'balance beam',
              socket: { cx: 100, cy: 90, r: 55 },
              svg: `<rect x="28" y="84" width="144" height="12" rx="4" fill="#c5a15a"/>`,
            },
            {
              id: 'fulcrum',
              label: 'still center',
              socket: { cx: 100, cy: 120, r: 32 },
              svg: `<path d="M100 96 L124 150 H76 Z" fill="#c5a15a"/>
                    <circle cx="100" cy="88" r="8" fill="#e2c57a"/>`,
            },
            {
              id: 'weights',
              label: 'twin weights',
              socket: { cx: 100, cy: 70, r: 70 },
              svg: `<circle cx="40" cy="70" r="16" fill="#c5a15a"/>
                    <circle cx="160" cy="70" r="16" fill="#c5a15a"/>
                    <path d="M40 86 V100 M160 86 V100" stroke="#8a6a2e" stroke-width="4"/>`,
            },
          ],
          decoys: [
            {
              id: 'crown',
              label: 'high crown',
              svg: `<path d="M50 120 L70 70 L100 100 L130 70 L150 120 Z" fill="#c5a15a"/>
                    <rect x="50" y="118" width="100" height="14" fill="#8a6a2e"/>`,
            },
          ],
        },
      ];

      const picker = document.getElementById('picker');
      const titleEl = document.getElementById('title');
      const hintEl = document.getElementById('hint');
      const stageEl = document.getElementById('stage');
      const trayEl = document.getElementById('tray');
      const startBtn = document.getElementById('startBtn');
      const resetBtn = document.getElementById('resetBtn');
      const statusEl = document.getElementById('status');
      const solvedEl = document.getElementById('solved');

      let puzzle = PUZZLES[0];
      let started = false;
      let selectedId = null;
      /** @type {Record<string, string>} socketId -> partId */
      let placed = {};
      /** @type {string[]} part ids still in tray (correct + decoys) */
      let trayIds = [];

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function allParts() {
        return [...puzzle.parts, ...(puzzle.decoys || [])];
      }

      function partById(id) {
        return allParts().find((p) => p.id === id);
      }

      function setStatus(msg, err = false) {
        statusEl.textContent = msg || '';
        statusEl.classList.toggle('err', err);
      }

      function renderPicker() {
        picker.innerHTML = '';
        for (const p of PUZZLES) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'pill' + (p.id === puzzle.id ? ' active' : '');
          b.textContent = p.title;
          b.addEventListener('click', () => {
            puzzle = p;
            bootPuzzle();
            renderPicker();
          });
          picker.appendChild(b);
        }
      }

      function ghostMarkup() {
        // Faint full assembly for preview / underlay
        return puzzle.parts
          .map(
            (p) =>
              `<g class="ghost-part" opacity="0.22" transform="translate(0 0)">${p.svg}</g>`,
          )
          .join('');
      }

      /** Prefer the smallest empty socket under the point (so outer rings don't steal taps). */
      function socketAt(x, y) {
        const hits = puzzle.parts
          .filter((p) => !placed[p.id])
          .map((p) => {
            const dx = x - p.socket.cx;
            const dy = y - p.socket.cy;
            const dist = Math.hypot(dx, dy);
            const inner = p.socket.innerR ?? 0;
            const inRing = dist <= p.socket.r && dist >= inner;
            return { id: p.id, r: p.socket.r, dist, inRing };
          })
          .filter((h) => h.inRing)
          .sort((a, b) => a.r - b.r);
        return hits[0]?.id ?? null;
      }

      function svgPointFromEvent(event) {
        const svg = stageEl.querySelector('svg');
        if (!svg) return null;
        const pt = svg.createSVGPoint();
        pt.x = event.clientX;
        pt.y = event.clientY;
        const ctm = svg.getScreenCTM();
        if (!ctm) return null;
        const local = pt.matrixTransform(ctm.inverse());
        return { x: local.x, y: local.y };
      }

      function renderStage() {
        // Draw large sockets first, small on top — visual only; hit-test uses socketAt().
        const socketParts = [...puzzle.parts].sort((a, b) => b.socket.r - a.socket.r);
        const sockets = socketParts
          .map((p) => {
            const filled = Boolean(placed[p.id]);
            const hot = started && selectedId && !filled;
            return `<circle
              class="socket${filled ? ' filled' : ''}${hot ? ' hot' : ''}"
              data-socket="${p.id}"
              cx="${p.socket.cx}" cy="${p.socket.cy}" r="${p.socket.r}"
            />`;
          })
          .join('');

        const placedSvg = puzzle.parts
          .filter((p) => placed[p.id])
          .map((p) => {
            const part = partById(placed[p.id]);
            return `<g class="placed" data-placed="${p.id}">${part.svg}</g>`;
          })
          .join('');

        const showGhost = !started || Object.keys(placed).length < puzzle.parts.length;

        stageEl.innerHTML = `<svg viewBox="0 0 200 200" role="img" aria-label="${puzzle.title}">
          ${showGhost ? `<g class="ghost-underlay">${ghostMarkup()}</g>` : ''}
          ${started ? sockets : ''}
          ${started ? placedSvg : ghostMarkup().replace(/opacity="0.22"/g, 'opacity="1"')}
        </svg>`;

        if (started) {
          const svg = stageEl.querySelector('svg');
          svg.addEventListener('click', (event) => {
            const local = svgPointFromEvent(event);
            if (!local) return;
            const id = socketAt(local.x, local.y);
            if (id) onSocket(id);
            else if (selectedId) setStatus('Tap a glowing socket.', true);
          });
        }
      }

      function renderTray() {
        trayEl.innerHTML = '';
        if (!started) return;

        for (const id of trayIds) {
          const part = partById(id);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'piece' + (selectedId === id ? ' selected' : '');
          btn.dataset.part = id;
          btn.innerHTML = `<svg viewBox="0 0 200 200">${part.svg}</svg><span>${part.label}</span>`;
          btn.addEventListener('click', () => onSelectPart(id, btn));
          trayEl.appendChild(btn);
        }
      }

      function onSelectPart(id, btn) {
        if (!started) return;
        if (selectedId === id) {
          selectedId = null;
          setStatus('Select a part, then a glowing socket.');
        } else {
          selectedId = id;
          setStatus(`Selected “${partById(id).label}” — tap a socket.`);
        }
        renderTray();
        renderStage();
      }

      function onSocket(socketId) {
        if (!started || !selectedId) {
          setStatus('Select a part from the tray first.', true);
          return;
        }
        if (placed[socketId]) return;

        const correct = selectedId === socketId;
        if (!correct) {
          const btn = trayEl.querySelector(`[data-part="${selectedId}"]`);
          if (btn) {
            btn.classList.remove('shake');
            void btn.offsetWidth;
            btn.classList.add('shake');
          }
          setStatus('That part does not belong there.', true);
          return;
        }

        placed[socketId] = selectedId;
        trayIds = trayIds.filter((id) => id !== selectedId);
        selectedId = null;
        setStatus('Locked in.');
        renderTray();
        renderStage();
        checkSolved();
      }

      function checkSolved() {
        if (puzzle.parts.every((p) => placed[p.id] === p.id)) {
          solvedEl.hidden = false;
          solvedEl.innerHTML = `<h3>Totem restored</h3>
            <p>${puzzle.teaching}</p>
            <p class="muted">Prototype only — no XP, no save.</p>`;
          setStatus('Complete.');
          // Reveal full emblem without dashed sockets
          started = true;
          renderStage();
          // Re-draw final without sockets: force full opacity assembly
          stageEl.innerHTML = `<svg viewBox="0 0 200 200">${puzzle.parts.map((p) => p.svg).join('')}</svg>`;
        }
      }

      function start() {
        placed = {};
        selectedId = null;
        trayIds = shuffle(allParts().map((p) => p.id));
        started = true;
        solvedEl.hidden = true;
        startBtn.hidden = true;
        resetBtn.hidden = false;
        hintEl.textContent =
          'Tap a part, then tap a glowing socket. Wrong parts shake and stay in the tray (including one decoy).';
        setStatus('Select a part, then a glowing socket.');
        renderStage();
        renderTray();
      }

      function bootPuzzle() {
        started = false;
        placed = {};
        selectedId = null;
        trayIds = [];
        titleEl.textContent = puzzle.title;
        hintEl.textContent = puzzle.blurb + ' Tap Start to shatter the totem into parts.';
        startBtn.hidden = false;
        resetBtn.hidden = true;
        solvedEl.hidden = true;
        setStatus('');
        renderStage();
        renderTray();
      }

      startBtn.addEventListener('click', start);
      resetBtn.addEventListener('click', start);

      renderPicker();
      bootPuzzle();
    </script>
  </body>
</html>
